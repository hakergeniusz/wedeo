[workspace]
members = [
    "crates/wedeo",
    "crates/wedeo-core",
    "crates/wedeo-codec",
    "crates/wedeo-format",
    "crates/wedeo-filter",
    "crates/wedeo-resample",
    "crates/wedeo-scale",
    "crates/wedeo-limits",
    "formats/wedeo-format-hevc",
    "codecs/wedeo-codec-pcm",
    "codecs/wedeo-codec-h264",
    "formats/wedeo-format-wav",
    "formats/wedeo-format-h264",
    "formats/wedeo-format-mp4",
    "codecs/wedeo-codec-vp9",
    "formats/wedeo-format-ivf",
    "formats/wedeo-format-webm",
    "adapters/wedeo-symphonia",
    "adapters/wedeo-rav1d",
    "adapters/wedeo-rav1e",
    "adapters/wedeo-h264-rusty",
    "adapters/wedeo-h265-oxideav",
    "adapters/wedeo-aac-oxideav",
    "adapters/wedeo-ac3-oxideav",
    "bins/wedeo-cli",
    "bins/wedeo-play",
    "tests/fate",
    "filters/wedeo-filter-graph",
    "filters/wedeo-filter-copy",
    "filters/wedeo-filter-format",
    "filters/wedeo-filter-crop",
    "filters/wedeo-filter-hflip",
    "filters/wedeo-filter-vflip",
    "filters/wedeo-filter-pad",
    "filters/wedeo-filter-transpose",
    "filters/wedeo-filter-fps",
    "formats/wedeo-format-ivf-mux",
    "formats/wedeo-format-flv-demux",
    "formats/wedeo-format-flv-mux",
    "formats/wedeo-format-avi-demux",
    "formats/wedeo-format-mpegts-demux",
    "formats/wedeo-format-mpegts-mux",
    "formats/wedeo-format-matroska-mux",
    "formats/wedeo-format-ogg",
    "codecs/wedeo-bsf-h264-mp4toannexb",
    "codecs/wedeo-bsf-hevc-mp4toannexb",
    "codecs/wedeo-bsf-aac-adtstoasc",
    "codecs/wedeo-codec-flac-native",
    "codecs/wedeo-codec-mpegvideo",
    "codecs/wedeo-codec-mpeg12",
    "codecs/wedeo-codec-vp8",
    "codecs/wedeo-codec-hevc-ps",
    "codecs/wedeo-codec-hevc-cabac",
    "codecs/wedeo-codec-hevc-dsp",
    "codecs/wedeo-codec-hevc-refs",
    "codecs/wedeo-codec-hevc",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-2.1-or-later"
description = "Rust rewrite of FFmpeg"
repository = "https://github.com/sharifhsn/wedeo"
readme = "README.md"
keywords = ["video", "ffmpeg", "h264", "codec", "multimedia"]
categories = ["multimedia::video", "multimedia::encoding"]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Rust 1.100 promoted needless_range_loop into clippy::all. FFmpeg ports keep
# explicit index arithmetic to match the C source verbatim; iterator rewrites
# risk breaking bit-exact parity in bitstream/reconstruction hot paths.
needless_range_loop = { level = "allow", priority = 0 }
# PCM byte loops mirror FFmpeg's fixed-size sample reads; keep chunks_exact.
chunks_exact_to_as_chunks = { level = "allow", priority = 0 }

[workspace.dependencies]
bitflags = "2"
divan = "0.1.21"
inventory = "0.3"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
cc = "1"

cpal = "0.17"
minifb = "0.28"
pollster = "0.4"
ringbuf = "0.5.2"
wgpu = "29"
winit = "0.30"
wedeo-core = { path = "crates/wedeo-core", version = "0.2.0" }
wedeo-codec = { path = "crates/wedeo-codec", version = "0.2.0" }
wedeo-format = { path = "crates/wedeo-format", version = "0.2.0" }
wedeo-filter = { path = "crates/wedeo-filter", version = "0.2.0" }
wedeo-resample = { path = "crates/wedeo-resample", version = "0.2.0" }
wedeo-scale = { path = "crates/wedeo-scale", version = "0.2.0" }
wedeo-codec-pcm = { path = "codecs/wedeo-codec-pcm", version = "0.2.0" }
wedeo-format-wav = { path = "formats/wedeo-format-wav", version = "0.2.0" }
wedeo-codec-h264 = { path = "codecs/wedeo-codec-h264", version = "0.2.0" }
wedeo-format-h264 = { path = "formats/wedeo-format-h264", version = "0.2.0" }
wedeo-format-mp4 = { path = "formats/wedeo-format-mp4", version = "0.2.0" }
wedeo-symphonia = { path = "adapters/wedeo-symphonia", version = "0.2.0" }
wedeo-rav1d = { path = "adapters/wedeo-rav1d", version = "0.2.0" }
wedeo-rav1e = { path = "adapters/wedeo-rav1e", version = "0.2.0" }
wedeo-h264-rusty = { path = "adapters/wedeo-h264-rusty", version = "0.2.0" }
wedeo-h265-oxideav = { path = "adapters/wedeo-h265-oxideav", version = "0.2.0" }
wedeo-aac-oxideav = { path = "adapters/wedeo-aac-oxideav", version = "0.2.0" }
wedeo-ac3-oxideav = { path = "adapters/wedeo-ac3-oxideav", version = "0.2.0" }

# Pure-Rust H.264 encoder (BSD-2-Clause). `default-features = false` avoids
# the global allocator and the unsafe accel crate; `std` keeps diagnostics.
rusty_h264-encoder = { version = "0.17.4", default-features = false, features = ["std"] }
rusty_h264-common = { version = "0.17.4", default-features = false, features = ["std"] }

# Pure-Rust HEVC decoder + encoder (MIT). The adapter uses oxideav-core types.
oxideav-h265 = "0.0.18"
oxideav-core = "0.1"

# Pure-Rust AAC decoder + encoder (MIT).
oxideav-aac = "0.1.7"

# Pure-Rust AC-3 / E-AC-3 decoder + encoder (MIT).
oxideav-ac3 = "0.0.12"
wedeo-codec-vp9 = { path = "codecs/wedeo-codec-vp9", version = "0.2.0" }
wedeo-format-ivf = { path = "formats/wedeo-format-ivf", version = "0.2.0" }
wedeo-format-webm = { path = "formats/wedeo-format-webm", version = "0.2.0" }
wedeo-filter-graph = { path = "filters/wedeo-filter-graph", version = "0.2.0" }
